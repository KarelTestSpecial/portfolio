name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # CV/** wordt door update-cv.yml gedaan: dat regeneert cv.json en pusht dat
    # met GITHUB_TOKEN. Zo'n token-commit triggert géén nieuwe workflow, dus als
    # deze workflow ook op CV/** zou vuren, deployde hij de OUDE cv.json.
    paths-ignore:
      - 'CV/**'
  workflow_dispatch:

# Eén deploy per keer. Zonder dit schrijven update-cv.yml en deze workflow
# gelijktijdig naar gh-pages, en dan wint de laatste — met een oudere build.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Build prototype
        run: pnpm run build:prototype

      - name: Deploy prototype to GitHub Pages
        run: pnpm run deploy:prototype
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
